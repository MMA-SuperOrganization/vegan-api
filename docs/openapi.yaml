  /search:
    get:
      tags:
        - search
      summary: Tìm recipe, food item và post theo type/filter
      operationId: searchContent
      x-auth: optional
      x-tests:
        - tests/contract/api-contract.test.js
        - tests/integration/discovery-admin-http.test.js
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: type
          in: query
          required: false
          schema:
            default: all
            type: string
            enum:
              - all
              - recipe
              - food-item
              - post
              - video
        - name: category
          in: query
          required: false
          schema:
            type: string
            pattern: ^[a-f\d]{24}$
        - name: cuisine
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: difficulty
          in: query
          required: false
          schema:
            type: string
            enum:
              - easy
              - medium
              - hard
        - name: maxTotalMinutes
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1440
        - name: tags
          in: query
          required: false
          schema:
            maxItems: 20
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 50
          style: form
          explode: true
        - name: excludeAllergenIds
          in: query
          required: false
          schema:
            maxItems: 20
            type: array
            items:
              type: string
              pattern: ^[a-f\d]{24}$
          style: form
          explode: true
        - name: dietType
          in: query
          required: false
          schema:
            type: string
            enum:
              - vegan
              - vegetarian
              - lacto_vegetarian
              - ovo_vegetarian
              - lacto_ovo_vegetarian
              - pescatarian
              - flexitarian
              - other
        - name: sort
          in: query
          required: false
          schema:
            default: newest
            type: string
            enum:
              - newest
              - oldest
              - title
              - popular
        - name: page
          in: query
          required: false
          schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 20
        - name: limit
          in: query
          required: false
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 50
