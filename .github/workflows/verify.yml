name: Build & Deploy
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize main releases so latest is not overwritten by an older concurrent build.
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - name: Verify native backend build
        run: npm run build
      - run: npm run test:run
      - run: npm audit --omit=dev
      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name vegan-test-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for _ in $(seq 1 30); do
            if docker exec vegan-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' > /dev/null; then break; fi
            sleep 1
          done
          docker exec vegan-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for _ in $(seq 1 30); do
            if docker exec vegan-test-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:database
        env:
          RUN_DATABASE_TESTS: "true"
          MONGODB_URI_TEST: mongodb://localhost:27017/test_vegan_ci_${{ github.run_id }}_${{ github.run_attempt }}?replicaSet=rs0&directConnection=true
      - run: docker build -t vegan-api:ci .
      - if: always()
        run: docker rm -f vegan-test-mongo || true

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=${REGISTRY}/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Trigger Coolify Deploy
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$COOLIFY_WEBHOOK_URL" || -z "$COOLIFY_TOKEN" ]]; then
            echo "::error::Set repository secrets COOLIFY_WEBHOOK_URL and COOLIFY_TOKEN before deploying."
            exit 1
          fi
          if [[ "$COOLIFY_WEBHOOK_URL" != https://* ]]; then
            echo "::error::COOLIFY_WEBHOOK_URL must use HTTPS."
            exit 1
          fi
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --proto '=https' --request GET \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --output /dev/null \
            "$COOLIFY_WEBHOOK_URL"
          echo "Coolify accepted the deploy request. Check the deployment status and readiness in Coolify."
